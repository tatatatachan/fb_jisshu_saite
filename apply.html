<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>実習の申込｜エフビー介護サービス 実習応募サイト</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2716%27 fill=%27%2300aca8%27/%3E%3C/svg%3E"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head><body>
<div class="wrap page"><div class="crumb"><a href="index.html">TOP</a> › 実習の申込</div><img class="pagephoto" src="img/hero.jpg" alt="利用者さんと話す社長"><h2 class="sec"><small>APPLY</small>実習の申込</h2>
<div class="notice">このフォームはダミーです。送信しても、どこにも届きません。本物のフォームは公開前に設定します。</div>
<div id="real"></div>
<form id="dummy" class="mt" novalidate>
<label>お名前<input name="name" required placeholder="例：山田 花子"></label>
<label>学校名・学年<input name="school" placeholder="例：〇〇高校 2年"></label>
<label>メールアドレス<input name="mail" type="email" placeholder="例：example@example.com"></label>
<label>希望の事業所<select name="fac"><option>どこでもよい</option></select></label>
<label>希望のプログラム<select name="prog"><option>1DAYプログラム</option><option>5DAYSプログラム</option><option>まだ決めていない</option></select></label>
<label>希望日<input name="date" type="date"></label>
<label>質問・相談したいこと<textarea name="q" rows="4"></textarea></label>
<p class="mt"><button class="btn orange" type="submit">送信する（ダミー）</button></p><p id="done" class="notice" hidden>ダミーのため送信されていません。</p>
</form>
<div class="contact"><b>お問い合わせ</b>
<p style="margin:.4em 0" id="tel"></p><p style="margin:.4em 0" id="mail"></p><p style="margin:.4em 0" id="rf"></p>
<div class="sns" id="sns"></div></div></div>
<script src="js/config.js"></script><script src="js/articles-data.js"></script><script src="js/site.js"></script><script>layout();
FACILITIES.forEach(f=>document.querySelector("[name=fac]").insertAdjacentHTML("beforeend",`<option>${esc(f.name)}</option>`));
if(C.applyFormUrl){document.getElementById("dummy").hidden=true;document.getElementById("real").innerHTML=`<a class="btn orange" href="${esc(C.applyFormUrl)}" target="_blank" rel="noopener">申込フォームを開く</a>`;}
document.getElementById("dummy").addEventListener("submit",e=>{e.preventDefault();document.getElementById("done").hidden=false;});
document.getElementById("tel").innerHTML=C.contactTel?`電話：<a href="tel:${esc(C.contactTel)}">${esc(C.contactTel)}</a> <span class="dummy">採用担当の番号か確認中</span>`:"";
document.getElementById("mail").innerHTML=C.contactEmail?`メール：<a href="mailto:${esc(C.contactEmail)}">${esc(C.contactEmail)}</a>`:`メール：採用担当のアドレスは確認中です <span class="dummy">準備中</span>`;
document.getElementById("rf").innerHTML=C.recruitFormUrl?`<a href="${esc(C.recruitFormUrl)}" target="_blank" rel="noopener">エフビー介護サービス公式サイトの採用問い合わせフォーム</a>`:"";
document.getElementById("sns").innerHTML=snsLinks();</script></body></html>
