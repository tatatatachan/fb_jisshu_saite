<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>記事｜エフビー介護サービス 実習</title><link rel="stylesheet" href="css/style.css"></head><body>
<div class="wrap" style="padding-bottom:48px"><div class="crumb"><a href="index.html">TOP</a> › <a href="articles.html">実習レポート・記事</a> › <span id="bc"></span></div><div id="a" class="article"></div><p class="center mt"><a class="btn orange" href="apply.html">実習に申し込む</a></p></div>
<script src="js/config.js"></script><script src="js/site.js"></script><script>layout();(async()=>{const id=new URLSearchParams(location.search).get("id");const a=(await loadArticles()).find(x=>String(x.id)===id);const el=document.getElementById("a");
if(!a){el.innerHTML="<p>記事が見つかりませんでした。</p>";return;}document.title=a.title+"｜エフビー介護サービス 実習";document.getElementById("bc").textContent=a.title;
const body=typeof a.body==="string"&&a.body.includes("<")&&C.source==="microcms"?a.body:esc(a.body).split("\n").map(l=>l?`<p>${l}</p>`:"").join("");
el.innerHTML=`<span class="label ${LABELS[a.category]||""}">${esc(a.category)}</span><span class="date">${esc(a.date)}</span><h1>${esc(a.title)}</h1>${body}`;})();</script></body></html>
