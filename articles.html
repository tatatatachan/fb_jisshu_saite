<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>実習レポート・記事｜エフビー介護サービス 実習</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2716%27 fill=%27%2300aca8%27/%3E%3C/svg%3E"><link rel="stylesheet" href="css/style.css"></head><body>
<div class="wrap"><div class="crumb"><a href="index.html">TOP</a> › 実習レポート・記事</div><h2 class="sec"><small>ARTICLES</small>実習レポート・記事</h2>
<div class="search"><input id="q" type="search" placeholder="キーワードで探す"></div><div class="tags" id="cats"></div><div class="tags mt" id="tags"></div><div class="grid mt" id="list"></div><p id="none" class="lead" hidden>該当する記事がありません。</p></div>
<script src="js/config.js"></script><script src="js/site.js"></script><script>layout();(async()=>{const all=await loadArticles();const p=new URLSearchParams(location.search);let cat=p.get("cat")||"",tag=p.get("tag")||"",q="";
const cats=["実習レポート","職員の声","人生の先輩のメッセージ","お知らせ"],tags=[...new Set(all.flatMap(x=>x.tags||[]))];
function draw(){const r=all.filter(a=>(!cat||a.category===cat)&&(!tag||(a.tags||[]).includes(tag))&&(!q||(a.title+a.summary+(a.body||"")).includes(q)));
document.getElementById("list").innerHTML=r.map(card).join("");document.getElementById("none").hidden=r.length>0;
document.getElementById("cats").innerHTML=["",...cats].map(c=>`<button class="tag ${c===cat?"on":""}" data-c="${esc(c)}">${c||"すべて"}</button>`).join("");
document.getElementById("tags").innerHTML=["",...tags].map(t=>`<button class="tag ${t===tag?"on":""}" data-t="${esc(t)}">${t?"#"+esc(t):"キーワードなし"}</button>`).join("");}
document.addEventListener("click",e=>{const b=e.target.closest("button.tag");if(!b)return;if("c"in b.dataset)cat=b.dataset.c;else tag=b.dataset.t;draw();});
document.getElementById("q").addEventListener("input",e=>{q=e.target.value;draw();});draw();})();</script></body></html>
